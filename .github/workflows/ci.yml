# Every push and pull request: the Go suite under the race detector on Linux,
# known-vulnerability scan, the client's unit tests, the production image with
# automatic certificates end to end, and the browser harnesses in headless
# Chrome against the real server. Actions are pinned to commits.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - name: go test -race
        # Failing tests become annotations, which the public API returns.
        run: |
          set -o pipefail
          go test ./... -race -count=1 2>&1 | tee /tmp/go-test.txt || {
            grep -E -- '--- FAIL|^FAIL|panic:|_test.go:[0-9]+:' /tmp/go-test.txt | head -15 |
              while IFS= read -r l; do echo "::error title=go test::$l"; done
            exit 1
          }
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: third-party notices are current
        run: bash ../tools/notices.sh | diff - ../THIRD_PARTY_NOTICES.md

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: npm test
        working-directory: web

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: docker build -t aether:dev .
      - name: automatic certificates against Pebble
        run: bash tools/e2e/acme.e2e.sh aether:dev

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: go build -trimpath -o /tmp/aether ./cmd/aether
        working-directory: engine
      - run: npm ci
        working-directory: tools/e2e
      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chrome's
      # sandbox needs; allowing them keeps the sandbox on (rather than
      # running Chrome with --no-sandbox).
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: harnesses
        run: bash tools/e2e/ci-browser.sh console layout messaging call joinrace reset signup twostep sso calendar push
