<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Aether">
  <title>Aether</title>
  <desc>An aperture: three arcs opening around a centre point.</desc>

  <!-- A flat, deep tile rather than a mint gradient with a 27% corner radius.
       A gradient-filled rounded square is a phone app icon; this is a mark. -->
  <rect width="64" height="64" rx="12" fill="#0E1A20" />

  <g fill="none" stroke="#23997A" stroke-width="4" stroke-linecap="round">
    <path d="M32 13.5A18.5 18.5 0 0 1 48 22.75" />
    <path d="M48 41.25A18.5 18.5 0 0 1 32 50.5" opacity=".72" />
    <path d="M16 41.25A18.5 18.5 0 0 1 16 22.75" opacity=".48" />
  </g>

  <circle cx="32" cy="32" r="6" fill="#23997A" />
</svg>
